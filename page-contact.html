<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>お問い合わせ｜OKAYAMA FUTURE VOICE</title>
    <meta name="description" content="OKAYAMA FUTURE VOICE へのお問い合わせはこちらのフォームよりお願いします。" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="img/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="img/favicon.png" />

    <!-- css -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/page.css" />
    <!-- js -->
    <script src="js/ham.js" defer></script>
    <script src="js/fadein.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kaisei+Opti&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Zen+Kaku+Gothic+New&family=Zen+Maru+Gothic&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header id="header" class="header">
      <div class="header-wrap">
        <div class="header-wrap__left">
          <div class="header-wrap__left__project">
            <a href="index.html"><img src="img/header_footer.png" alt="OKAYAMA FUTURE VOICE 次世代へつなぐ言葉" /></a>
          </div>
        </div>
        <nav class="header-wrap__nav">
          <ul class="header-wrap__nav__list">
            <li class="header-wrap__nav__list__item">
              <a href="index.html">TOP</a>
            </li>
            <li class="header-wrap__nav__list__item">
              <a href="page-policy.html">プライバシーポリシー</a>
            </li>
            <li class="header-wrap__nav__list__item">
              <a href="page-contact.html">問い合わせ</a>
            </li>
          </ul>
        </nav>
        <button class="ham" type="button" aria-label="メニュー" aria-controls="ham-menu" aria-expanded="false">
          <span class="ham__bar"></span>
          <span class="ham__bar"></span>
          <span class="ham__bar"></span>
        </button>
      </div>
    </header>

    <!-- ===== ハンバーガーメニュー（モバイル用オーバーレイ） ===== -->
    <div id="ham-menu" class="ham-menu" aria-hidden="true">
      <nav class="ham-menu__nav">
        <ul>
          <li><a href="index.html">TOP</a></li>
          <li><a href="page-policy.html">プライバシーポリシー</a></li>
          <li><a href="page-contact.html">問い合わせ</a></li>
        </ul>
      </nav>
    </div>

    <main id="main" class="main">
      <section class="page">
        <div class="page__inner">
          <h1 class="page__title js-fadein">CONTACT</h1>
          <p class="page__subtitle js-fadein">お問い合わせ</p>

          <p class="page__lead js-fadein">
            OKAYAMA FUTURE VOICE に関するご質問・ご感想・取材のご依頼などは、下記のフォームよりお気軽にお寄せください。<br />
            内容を確認のうえ、担当者よりご返信いたします。
          </p>

          <form class="contact-form js-fadein" action="#" method="post" novalidate>
            <div class="contact-form__row">
              <label class="contact-form__label contact-form__label--required" for="name">お名前</label>
              <input class="contact-form__input" type="text" id="name" name="name" required autocomplete="name" />
            </div>

            <div class="contact-form__row">
              <label class="contact-form__label contact-form__label--required" for="email">メールアドレス</label>
              <input class="contact-form__input" type="email" id="email" name="email" required autocomplete="email" />
            </div>

            <div class="contact-form__row">
              <label class="contact-form__label" for="subject">件名</label>
              <input class="contact-form__input" type="text" id="subject" name="subject" />
            </div>

            <div class="contact-form__row">
              <label class="contact-form__label contact-form__label--required" for="message">お問い合わせ内容</label>
              <textarea class="contact-form__textarea" id="message" name="message" rows="8" required></textarea>
            </div>

            <div class="contact-form__row contact-form__row--check">
              <label class="contact-form__check">
                <input type="checkbox" id="agree" name="agree" required />
                <span>
                  <a href="page-policy.html" class="page__link">プライバシーポリシー</a>に同意する
                </span>
              </label>
            </div>

            <button type="submit" class="contact-form__submit">SEND →</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <a href="http://www.fm790.co.jp/" class="footer__logo">
        <img src="img/Radiomomo_logo.png" alt="Radio momo" />
      </a>
      <a class="footer__brand-link" href="index.html"><img class="footer__brand" src="img/header_footer.png" alt="OKAYAMA FUTURE VOICE 次世代へつなぐ言葉" /></a>
      <p class="footer__copy">Copyright © Radio momo. All Rights Reserved.</p>
    </footer>
  </body>
</html>
